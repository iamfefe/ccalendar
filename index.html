<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="快記行事曆">
<title>快記行事曆</title>
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
  :root { --bg:#f5f5f7; --card:#fff; --fg:#1d1d1f; --muted:#6e6e73; --accent:#007aff; --border:#d2d2d7; --ok:#34c759; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --card:#1c1c1e; --fg:#f5f5f7; --muted:#98989d; --accent:#0a84ff; --border:#38383a; --ok:#30d158; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-size:32px; background:var(--bg); color:var(--fg);
    font-family:-apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif;
    padding:env(safe-area-inset-top) 16px 32px; }
  main { max-width:520px; margin:0 auto; }
  h1 { font-size:56px; margin:24px 0 4px; }
  h2 { font-size:40px; margin:28px 0 8px; display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between; align-items:center; }
  .hint { color:var(--muted); font-size:28px; margin:0 0 16px; }
  textarea { width:100%; font-size:36px; padding:14px; border-radius:14px;
    border:1px solid var(--border); background:var(--card); color:var(--fg); resize:none; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-top:14px; border:1px solid var(--border); }
  .row { display:flex; gap:8px; margin:8px 0; align-items:center; }
  .row label { width:72px; color:var(--muted); font-size:28px; flex-shrink:0; }
  .row input { flex:1; min-width:0; font-size:32px; padding:8px; border-radius:8px;
    border:1px solid var(--border); background:var(--bg); color:var(--fg); }
  button { width:100%; font-size:34px; font-weight:600; padding:14px; border:0; border-radius:14px;
    margin-top:12px; background:var(--accent); color:#fff; }
  button.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button.small { width:auto; font-size:28px; padding:6px 12px; margin:0; border-radius:10px; }
  .btns { display:flex; flex-direction:column; gap:0; }
  .btns button { flex:1; }
  .ev { display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); }
  .ev:last-child { border-bottom:0; }
  .ev .t { width:100px; flex-shrink:0; color:var(--accent); font-variant-numeric:tabular-nums; font-weight:600; }
  .empty { color:var(--muted); padding:8px 0; }
  .toast { color:var(--ok); font-size:28px; min-height:20px; margin-top:8px; text-align:center; }
  .examples { color:var(--muted); font-size:26px; line-height:1.7; margin-top:16px; }
  input[type=checkbox] { width:32px; height:32px; }
  .ev { align-items:baseline; }
</style>
</head>
<body>
<main>
  <h1>快記行事曆</h1>
  <p class="hint">打一句話，例如「明天下午3點 看牙醫」</p>

  <div id="signedOut">
    <button id="signin">登入 Google 日曆</button>
    <p class="hint" style="margin-top:8px">登入後才能直接新增事件和讀取今天的行程</p>
  </div>

  <div id="signedIn" hidden>
    <textarea id="text" rows="2" placeholder="12/5 15:00 看牙醫"></textarea>

    <div class="card">
      <div class="row"><label>事件</label><input id="title"></div>
      <div class="row"><label>日期</label><input id="date" type="date"></div>
      <div class="row"><label>時間</label><input id="time" type="time"></div>
      <div class="row"><label>長度</label><input id="dur" type="number" value="60" min="5" step="15"><span style="color:var(--muted)">分鐘</span></div>
      <div class="row"><label>全天</label><input id="allday" type="checkbox" style="flex:none"></div>
    </div>

    <button id="add">加入 Google 日曆</button>
    <div class="toast" id="toast"></div>

    <h2>今天的行程 <button id="refresh" class="small secondary">重新整理</button></h2>
    <div class="card" id="today"><div class="empty">載入中…</div></div>
    <div class="btns">
      <button id="speak">🔊 語音播報</button>
      <button id="stop" class="secondary">停止</button>
    </div>

    <div class="examples">
      支援寫法：今天 / 明天 / 後天 / 週五 / 下週三 / 12/5 / 12月5日 / 2026-12-05<br>
      時間：15:00 / 3點 / 下午3點半 / 晚上8點<br>
      沒寫時間 → 自動設成全天事件
    </div>
  </div>
</main>

<script>
// ===== 設定：貼上你在 Google Cloud 建立的 OAuth 用戶端 ID =====
const CLIENT_ID = '158710260245-sp68kdojoefehe08o4bt573cur0m0aka.apps.googleusercontent.com';
const SCOPE = 'https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/calendar.calendarlist.readonly';
const BASE = 'https://www.googleapis.com/calendar/v3';
const API = `${BASE}/calendars/primary/events`;
const TOKEN_KEY = 'gtoken2'; // 權限範圍變了，換 key 讓舊的登入失效

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const WD = { '日':0,'天':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6 };
const CN = { '一':1,'二':2,'兩':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'十一':11,'十二':12 };

// ---------- 文字解析 ----------
function parse(text) {
  let s = text.trim();
  const today = new Date(); today.setHours(0,0,0,0);
  let date = null, time = null, m;

  if ((m = s.match(/(\d{4})[-\/.年](\d{1,2})[-\/.月](\d{1,2})日?/))) {
    date = new Date(+m[1], m[2]-1, +m[3]);
  } else if ((m = s.match(/(\d{1,2})[\/月](\d{1,2})[日號]?/))) {
    date = new Date(today.getFullYear(), m[1]-1, +m[2]);
    if (date < today) date.setFullYear(date.getFullYear()+1);
  } else if ((m = s.match(/今天|明天|後天|大後天/))) {
    date = new Date(today);
    date.setDate(date.getDate() + ({'今天':0,'明天':1,'後天':2,'大後天':3})[m[0]]);
  } else if ((m = s.match(/(下下|下)?(?:週|周|星期|禮拜)([日天一二三四五六])/))) {
    const target = WD[m[2]];
    date = new Date(today);
    let diff = (target - today.getDay() + 7) % 7;
    if (m[1]) {
      const mondayOffset = (today.getDay() + 6) % 7;
      diff = 7 - mondayOffset + ((target + 6) % 7) + (m[1] === '下下' ? 7 : 0);
    }
    date.setDate(date.getDate() + diff);
  }
  if (m && date) s = s.replace(m[0], ' ');

  if ((m = s.match(/(早上|上午|中午|下午|傍晚|晚上)?\s*(\d{1,2}):(\d{2})/))) {
    time = [+m[2], +m[3], m[1]];
  } else if ((m = s.match(/(早上|上午|中午|下午|傍晚|晚上)?\s*(\d{1,2}|十[一二]?|[一二兩三四五六七八九十])\s*[點点時](半|(\d{1,2})分?)?/))) {
    const h = /\d/.test(m[2]) ? +m[2] : CN[m[2]];
    time = [h, m[3] === '半' ? 30 : (m[4] ? +m[4] : 0), m[1]];
  }
  if (time) {
    s = s.replace(m[0], ' ');
    let [h, mi, period] = time;
    if (/下午|傍晚|晚上/.test(period || '') && h < 12) h += 12;
    if (period === '中午' && h < 6) h += 12;
    time = `${pad(h)}:${pad(mi)}`;
  }

  const title = s.replace(/\s+/g, ' ').replace(/^[\s,，、:：]+|[\s,，、]+$/g, '').trim();
  return { title, date: date ? ymd(date) : '', time: time || '' };
}

$('text').addEventListener('input', () => {
  const r = parse($('text').value);
  $('title').value = r.title;
  $('date').value = r.date;
  $('time').value = r.time;
  $('allday').checked = !r.time;
});

// ---------- Google 登入 ----------
let token = null, tokenClient = null;
try {
  localStorage.removeItem('gtoken');
  const saved = JSON.parse(localStorage.getItem(TOKEN_KEY) || 'null');
  if (saved && saved.exp > Date.now()) token = saved.token;
} catch (e) {}

function initClient() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPE,
    callback: resp => {
      if (resp.error) { alert('登入失敗：' + resp.error); return; }
      token = resp.access_token;
      try { localStorage.setItem(TOKEN_KEY, JSON.stringify({ token, exp: Date.now() + (resp.expires_in - 60) * 1000 })); } catch (e) {}
      showSignedIn();
      if (pending) { const p = pending; pending = null; p(); }
    }
  });
}
(function waitGsi() { window.google?.accounts?.oauth2 ? initClient() : setTimeout(waitGsi, 100); })();

let pending = null;
function signIn(then) {
  if (!tokenClient) { alert('Google 登入元件還在載入，請稍候再試'); return; }
  pending = then || null;
  tokenClient.requestAccessToken({ prompt: '' });
}
$('signin').onclick = () => signIn();

function showSignedIn() {
  $('signedOut').hidden = true;
  $('signedIn').hidden = false;
  loadToday();
}
if (token) showSignedIn();

async function gapi(url, opts = {}) {
  const res = await fetch(url, { ...opts, headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' } });
  if (res.status === 401) {
    token = null;
    try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
    return new Promise((ok, fail) => signIn(() => gapi(url, opts).then(ok, fail)));
  }
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

// ---------- 新增事件 ----------
$('add').onclick = async () => {
  const title = $('title').value.trim() || '新事件';
  const date = $('date').value || ymd(new Date());
  const allday = $('allday').checked || !$('time').value;
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const [Y, M, D] = date.split('-').map(Number);
  let body;
  if (allday) {
    body = { summary: title, start: { date }, end: { date: ymd(new Date(Y, M-1, D+1)) } };
  } else {
    const [h, mi] = $('time').value.split(':').map(Number);
    const s = new Date(Y, M-1, D, h, mi);
    const e = new Date(s.getTime() + (+$('dur').value || 60) * 60000);
    body = { summary: title, start: { dateTime: s.toISOString(), timeZone: tz }, end: { dateTime: e.toISOString(), timeZone: tz } };
  }
  $('add').disabled = true;
  try {
    await gapi(API, { method: 'POST', body: JSON.stringify(body) });
    $('toast').textContent = `✓ 已加入：${title}`;
    $('text').value = ''; $('title').value = ''; $('time').value = '';
    loadToday();
  } catch (err) {
    alert('新增失敗：' + err.message);
  } finally {
    $('add').disabled = false;
    setTimeout(() => $('toast').textContent = '', 3000);
  }
};

// ---------- 今天的行程 ----------
let todayEvents = [];
async function loadToday() {
  const start = new Date(); start.setHours(0,0,0,0);
  const end = new Date(start); end.setDate(end.getDate() + 1);
  const q = new URLSearchParams({ timeMin: start.toISOString(), timeMax: end.toISOString(), singleEvents: 'true', orderBy: 'startTime' });
  try {
    // 讀取你在 Google 日曆裡有勾選顯示的所有日曆（含訂閱、公告、節日等）
    const list = await gapi(`${BASE}/users/me/calendarList?minAccessRole=reader`);
    const cals = (list.items || []).filter(c => c.selected && !c.hidden);
    if (!cals.length) cals.push({ id: 'primary', backgroundColor: '#007aff' });
    const results = await Promise.all(cals.map(c =>
      gapi(`${BASE}/calendars/${encodeURIComponent(c.id)}/events?${q}`)
        .then(d => (d.items || []).map(e => ({ ...e, _color: c.backgroundColor })))
        .catch(() => [])  // 某個日曆讀不到就略過
    ));
    todayEvents = mergeEvents(results.flat());
    renderToday();
  } catch (err) {
    $('today').innerHTML = `<div class="empty">讀取失敗：${err.message}</div>`;
  }
}
$('refresh').onclick = loadToday;

// 合併多個日曆：全天在前、依時間排序、去掉重複（同名同時間）
function mergeEvents(items) {
  const seen = new Set();
  return items
    .filter(e => e.status !== 'cancelled')
    .map(e => ({
      title: e.summary || '（無標題）',
      time: e.start.dateTime ? new Date(e.start.dateTime) : null,
      color: e._color
    }))
    .filter(e => {
      const k = e.title + '|' + (e.time ? e.time.getTime() : 'allday');
      if (seen.has(k)) return false;
      seen.add(k); return true;
    })
    .sort((a, b) => (a.time ? a.time.getTime() : -1) - (b.time ? b.time.getTime() : -1));
}

function renderToday() {
  const box = $('today');
  box.innerHTML = '';
  if (!todayEvents.length) { box.innerHTML = '<div class="empty">今天沒有行程 🎉</div>'; return; }
  for (const e of todayEvents) {
    const row = document.createElement('div'); row.className = 'ev';
    const t = document.createElement('div'); t.className = 't';
    t.textContent = e.time ? `${pad(e.time.getHours())}:${pad(e.time.getMinutes())}` : '全天';
    const n = document.createElement('div'); n.textContent = e.title;
    if (e.color) n.style.cssText = `border-left:4px solid ${e.color};padding-left:8px`;
    row.append(t, n); box.append(row);
  }
}

// ---------- 語音播報 ----------
function spokenTime(d) {
  const h = d.getHours(), m = d.getMinutes();
  const period = h < 5 ? '凌晨' : h < 12 ? '早上' : h < 13 ? '中午' : h < 18 ? '下午' : '晚上';
  const h12 = h > 12 ? h - 12 : (h === 0 ? 12 : h);
  return `${period}${h12}點` + (m === 0 ? '' : m === 30 ? '半' : `${m}分`);
}
function buildSpeech(events, now = new Date()) {
  const wd = '日一二三四五六'[now.getDay()];
  let s = `今天是${now.getMonth()+1}月${now.getDate()}日，星期${wd}。`;
  if (!events.length) return s + '今天沒有行程。';
  s += `今天有${events.length}個行程。`;
  for (const e of events) s += (e.time ? `${spokenTime(e.time)}，` : '全天，') + `${e.title}。`;
  return s;
}
$('speak').onclick = () => {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(buildSpeech(todayEvents));
  u.lang = 'zh-TW';
  const v = speechSynthesis.getVoices().find(v => v.lang === 'zh-TW');
  if (v) u.voice = v;
  u.rate = 1;
  speechSynthesis.speak(u);
};
$('stop').onclick = () => speechSynthesis.cancel();
</script>
</body>
</html>
