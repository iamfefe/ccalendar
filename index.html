<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="快記行事曆">
<title>快記行事曆</title>
<style>
  :root { --bg:#f5f5f7; --card:#fff; --fg:#1d1d1f; --muted:#6e6e73; --accent:#007aff; --border:#d2d2d7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --card:#1c1c1e; --fg:#f5f5f7; --muted:#98989d; --accent:#0a84ff; --border:#38383a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif;
    padding:env(safe-area-inset-top) 16px 32px; }
  main { max-width:520px; margin:0 auto; }
  h1 { font-size:28px; margin:24px 0 4px; }
  .hint { color:var(--muted); font-size:14px; margin:0 0 16px; }
  textarea { width:100%; font-size:18px; padding:14px; border-radius:14px;
    border:1px solid var(--border); background:var(--card); color:var(--fg); resize:none; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-top:14px; border:1px solid var(--border); }
  .row { display:flex; gap:8px; margin:8px 0; align-items:center; }
  .row label { width:52px; color:var(--muted); font-size:14px; flex-shrink:0; }
  .row input { flex:1; min-width:0; font-size:16px; padding:8px; border-radius:8px;
    border:1px solid var(--border); background:var(--bg); color:var(--fg); }
  button { width:100%; font-size:17px; font-weight:600; padding:14px; border:0; border-radius:14px;
    margin-top:12px; background:var(--accent); color:#fff; }
  button.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  .examples { color:var(--muted); font-size:13px; line-height:1.7; margin-top:16px; }
</style>
</head>
<body>
<main>
  <h1>快記行事曆</h1>
  <p class="hint">打一句話，例如「明天下午3點 看牙醫」</p>

  <textarea id="text" rows="2" placeholder="12/5 15:00 看牙醫"></textarea>

  <div class="card">
    <div class="row"><label>事件</label><input id="title"></div>
    <div class="row"><label>日期</label><input id="date" type="date"></div>
    <div class="row"><label>時間</label><input id="time" type="time"></div>
    <div class="row"><label>長度</label><input id="dur" type="number" value="60" min="5" step="15"><span style="color:var(--muted)">分鐘</span></div>
    <div class="row"><label>全天</label><input id="allday" type="checkbox" style="flex:0"></div>
  </div>

  <button id="addIcs">加入 iPhone 行事曆</button>
  <button id="addGoogle" class="secondary">加入 Google 日曆</button>

  <div class="examples">
    支援寫法：今天 / 明天 / 後天 / 週五 / 下週三 / 12/5 / 12月5日 / 2026-12-05<br>
    時間：15:00 / 3點 / 下午3點半 / 晚上8點<br>
    沒寫時間 → 自動設成全天事件
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const WD = { '日':0,'天':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6 };
const CN = { '一':1,'二':2,'兩':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'十一':11,'十二':12 };

function parse(text) {
  let s = text.trim();
  const today = new Date(); today.setHours(0,0,0,0);
  let date = null, time = null, m;

  // --- date ---
  if ((m = s.match(/(\d{4})[-\/.年](\d{1,2})[-\/.月](\d{1,2})日?/))) {
    date = new Date(+m[1], m[2]-1, +m[3]);
  } else if ((m = s.match(/(\d{1,2})[\/月](\d{1,2})[日號]?/))) {
    date = new Date(today.getFullYear(), m[1]-1, +m[2]);
    if (date < today) date.setFullYear(date.getFullYear()+1); // 已過就算明年
  } else if ((m = s.match(/今天|明天|後天|大後天/))) {
    date = new Date(today);
    date.setDate(date.getDate() + ({'今天':0,'明天':1,'後天':2,'大後天':3})[m[0]]);
  } else if ((m = s.match(/(下下|下)?(?:週|周|星期|禮拜)([日天一二三四五六])/))) {
    const target = WD[m[2]];
    date = new Date(today);
    let diff = (target - today.getDay() + 7) % 7;
    if (m[1]) {
      // 下週X：下週的那一天（週一為一週開始）
      const mondayOffset = (today.getDay() + 6) % 7;
      diff = 7 - mondayOffset + ((target + 6) % 7) + (m[1] === '下下' ? 7 : 0);
    }
    date.setDate(date.getDate() + diff);
  }
  if (m && date) s = s.replace(m[0], ' ');

  // --- time ---
  if ((m = s.match(/(早上|上午|中午|下午|傍晚|晚上)?\s*(\d{1,2}):(\d{2})/))) {
    time = [+m[2], +m[3], m[1]];
  } else if ((m = s.match(/(早上|上午|中午|下午|傍晚|晚上)?\s*(\d{1,2}|十[一二]?|[一二兩三四五六七八九十])\s*[點点時](半|(\d{1,2})分?)?/))) {
    const h = /\d/.test(m[2]) ? +m[2] : CN[m[2]];
    time = [h, m[3] === '半' ? 30 : (m[4] ? +m[4] : 0), m[1]];
  }
  if (time) {
    s = s.replace(m[0], ' ');
    let [h, mi, period] = time;
    if (/下午|傍晚|晚上/.test(period || '') && h < 12) h += 12;
    if (period === '中午' && h < 6) h += 12;
    time = `${pad(h)}:${pad(mi)}`;
  }

  const title = s.replace(/\s+/g, ' ').replace(/^[\s,，、:：]+|[\s,，、]+$/g, '').trim();
  return { title, date: date ? ymd(date) : '', time: time || '' };
}

function fill() {
  const r = parse($('text').value);
  $('title').value = r.title;
  $('date').value = r.date;
  $('time').value = r.time;
  $('allday').checked = !r.time;
}
$('text').addEventListener('input', fill);

function getEvent() {
  const title = $('title').value.trim() || '新事件';
  const date = $('date').value || ymd(new Date());
  const allday = $('allday').checked || !$('time').value;
  const [Y, M, D] = date.split('-').map(Number);
  let start, end;
  if (allday) {
    start = new Date(Y, M-1, D); end = new Date(Y, M-1, D+1);
  } else {
    const [h, mi] = $('time').value.split(':').map(Number);
    start = new Date(Y, M-1, D, h, mi);
    end = new Date(start.getTime() + (+$('dur').value || 60) * 60000);
  }
  return { title, allday, start, end };
}

const fmtDate = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
const fmtUTC = d => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
const esc = t => t.replace(/[\\;,]/g, c => '\\' + c).replace(/\n/g, '\\n');

$('addIcs').onclick = () => {
  const e = getEvent();
  const dt = e.allday
    ? `DTSTART;VALUE=DATE:${fmtDate(e.start)}\r\nDTEND;VALUE=DATE:${fmtDate(e.end)}`
    : `DTSTART:${fmtUTC(e.start)}\r\nDTEND:${fmtUTC(e.end)}`;
  const ics = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//quick-cal//ZH', 'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    `UID:${Date.now()}-${Math.random().toString(36).slice(2)}@quick-cal`,
    `DTSTAMP:${fmtUTC(new Date())}`,
    dt,
    `SUMMARY:${esc(e.title)}`,
    'END:VEVENT', 'END:VCALENDAR'
  ].join('\r\n');
  // iOS Safari 打開 text/calendar 會直接跳出「加入行事曆」
  location.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
};

$('addGoogle').onclick = () => {
  const e = getEvent();
  const dates = e.allday ? `${fmtDate(e.start)}/${fmtDate(e.end)}` : `${fmtUTC(e.start)}/${fmtUTC(e.end)}`;
  const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(e.title)}&dates=${dates}`;
  window.open(url, '_blank');
};
</script>
</body>
</html>
